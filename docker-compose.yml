version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: oktopus
      POSTGRES_USER: oktopus
      POSTGRES_PASSWORD: oktopus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oktopus -d oktopus"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: