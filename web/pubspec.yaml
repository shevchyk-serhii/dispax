name: oktopus
description: "Dispax - Ride dispatch platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  http: ^1.2.2
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.2
  table_calendar: ^3.1.2
  intl: ^0.20.2
  google_maps_flutter: ^2.2.0
  mapbox_maps_flutter: ^2.4.0
  geolocator: ^13.0.1
  url_launcher: ^6.3.0
  local_auth: ^2.1.6
  web_socket_channel: ^3.0.1
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/dispax_icon.png
    - assets/driver_marker.svg
    - assets/client_marker.svg
    - assets/pickup_marker.svg
    - assets/destination_marker.svg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/dispax_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#1976D2"
  adaptive_icon_foreground: "assets/dispax_icon.png"
