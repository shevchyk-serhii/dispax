name: dispax
description: "Dispax - Ride dispatch platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  http: ^1.2.2
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.2
  table_calendar: ^3.1.2
  intl: ^0.20.2
  google_maps_flutter: ^2.2.0
  mapbox_maps_flutter: ^2.25.0
  geolocator: ^13.0.1
  url_launcher: ^6.3.0
  local_auth: ^2.1.6
  web_socket_channel: ^3.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1
  image_picker: ^1.1.2
  http_parser: ^4.0.2
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  patrol: ^4.6.0
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

  test_api: any
  url_launcher_platform_interface: any
  plugin_platform_interface: any

patrol:
  app_name: Dispax
  test_directory: integration_test
  android:
    package_name: de.dispax.app
  ios:
    bundle_id: de.dispax.app
flutter:
  generate: true
  uses-material-design: true
  config:
    swift-package-manager: false
  assets:
    - assets/
    - assets/dispax_icon.png
    - assets/driver_marker.svg
    - assets/client_marker.svg
    - assets/pickup_marker.svg
    - assets/destination_marker.svg
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/dispax_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#1976D2"
  adaptive_icon_foreground: "assets/dispax_icon.png"
