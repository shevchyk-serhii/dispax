name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least-privilege: CI only runs tests. Deployment is done manually from a local
# machine (`make deploy`), so no id-token/WIF permissions are needed here.
permissions:
  contents: read

# Cancel superseded runs on PRs (a new push obsoletes the previous run). On master
# we keep runs alive (cancel-in-progress: false) so test runs are not aborted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test + Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Cache sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.coursier
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', '**/plugins.sbt') }}
          restore-keys: ${{ runner.os }}-sbt-

      - name: Check formatting (scalafmt)
        run: sbt -batch scalafmtCheckAll scalafmtSbtCheck

      # Integration tests use Testcontainers, which needs a Docker daemon. It is
      # available on ubuntu-latest runners out of the box.
      - name: Run tests with coverage
        run: sbt -batch coverage test coverageAggregate

      - name: Coverage summary
        if: always()
        run: |
          echo "## Test coverage" >> "$GITHUB_STEP_SUMMARY"
          report="target/scala-3.3.7/scoverage-report/scoverage.xml"
          if [ -f "$report" ]; then
            rate=$(grep -o 'statement-rate="[0-9.]*"' "$report" | head -1 | grep -o '[0-9.]*')
            branch=$(grep -o 'branch-rate="[0-9.]*"' "$report" | head -1 | grep -o '[0-9.]*')
            echo "- Statement coverage: **${rate}%**" >> "$GITHUB_STEP_SUMMARY"
            echo "- Branch coverage: **${branch}%**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Aggregate coverage report not found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoverage-report
          path: |
            target/scala-3.3.7/scoverage-report/**
            '**/target/scala-3.3.7/scoverage-report/**'
          if-no-files-found: ignore

  bdd:
    name: BDD (Cucumber)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The Cucumber suite runs entirely on in-memory repositories (TestApplication),
    # so it needs no Postgres/Testcontainers. Kept non-blocking for now: failures are
    # visible in the run but do not gate the build while the suite stabilizes.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Cache sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.coursier
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', '**/plugins.sbt') }}
          restore-keys: ${{ runner.os }}-sbt-

      - name: Run Cucumber scenarios
        run: sbt -batch cucumber

      - name: Upload Cucumber report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: target/cucumber-reports/**
          if-no-files-found: ignore

  flutter:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pin the exact Flutter version so CI is deterministic: a new stable
          # release must be adopted explicitly (bump here), not auto-picked up.
          # Keep this in sync with the version used locally (FVM / fvm use).
          flutter-version: 3.44.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting (dart format)
        run: dart format --output=none --set-exit-if-changed lib/

      - name: Analyze
        run: flutter analyze

      # Unit / bloc tests only (web/test). The e2e suite in web/integration_test
      # needs a running backend and is run locally, not in CI.
      - name: Run unit tests
        run: flutter test
