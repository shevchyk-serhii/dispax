<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1C1C2E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F0F18;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A855F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <filter id="dotGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#bgGrad)"/>

  <!-- Letter D — three horizontal stripes forming a "D" shape -->
  <!-- Top bar -->
  <rect x="248" y="288" width="320" height="72" rx="36" fill="white" opacity="0.95"/>
  <!-- Middle bar (shorter) -->
  <rect x="248" y="476" width="380" height="72" rx="36" fill="white" opacity="0.95"/>
  <!-- Bottom bar -->
  <rect x="248" y="664" width="320" height="72" rx="36" fill="white" opacity="0.95"/>
  <!-- Vertical left stroke -->
  <rect x="248" y="288" width="72" height="448" rx="36" fill="white" opacity="0.95"/>
  <!-- Right curve cap — rounded right edge connecting top & bottom -->
  <path d="M 520 288 Q 720 288 720 512 Q 720 736 520 736" stroke="white" stroke-width="72" fill="none" stroke-linecap="round" opacity="0.95"/>

  <!-- Accent dot — dispatch signal -->
  <circle cx="726" cy="726" r="96" fill="url(#dotGrad)" filter="url(#dotGlow)"/>
  <!-- Inner highlight -->
  <circle cx="700" cy="700" r="28" fill="white" opacity="0.35"/>
</svg>
