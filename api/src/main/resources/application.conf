server {
  host = "0.0.0.0"
  port = 8080
  port = ${?PORT} # Override with environment variable if provided
}

database {
  driver = "org.postgresql.Driver"
  url = "jdbc:postgresql://localhost:5432/oktopus"
  url = ${?DATABASE_URL}
  user = ${DATABASE_USER}
  password = ${DATABASE_PASSWORD}
  maxPoolSize = 10
  maxPoolSize = ${?DATABASE_MAX_POOL_SIZE}
  minIdle = 2
  minIdle = ${?DATABASE_MIN_IDLE}
}

flyway {
  locations = ["classpath:db/migration"]
  baselineOnMigrate = true
}

here {
  api-key = ""
  api-key = ${?HERE_API_KEY}
  base-url = "https://router.hereapi.com"
}