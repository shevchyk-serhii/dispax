# Development configuration
# Includes test data and development-friendly settings

server {
  host = "0.0.0.0"
  port = 8080
}

database {
  driver = "org.postgresql.Driver"
  # Overridable so the e2e harness can point a dev-mode backend at the
  # isolated test DB (make e2e-backend-up → :5433/dispax_test). Without the
  # substitution the URL was hardcoded and the "isolated" e2e backend
  # silently shared the dev database.
  url = "jdbc:postgresql://localhost:5432/dispax"
  url = ${?DATABASE_URL}
  user = "dispax"
  user = ${?DATABASE_USER}
  password = "dispax"
  password = ${?DATABASE_PASSWORD}
  maxPoolSize = 10
  minIdle = 2
}

# Development specific settings
flyway {
  environment = "development"
  # In development, run all migrations including test data
  locations = ["classpath:db/migration", "classpath:db/migration-dev"]
  baselineOnMigrate = true
}

smtp {
  host = "localhost"
  host = ${?SMTP_HOST}
  port = 1025
  port = ${?SMTP_PORT}
  user = ""
  user = ${?SMTP_USER}
  password = ""
  password = ${?SMTP_PASSWORD}
  from = "noreply@dispax.de"
  from = ${?SMTP_FROM}
  replyTo = "support@dispax.de"
  replyTo = ${?SMTP_REPLY_TO}
  # NONE = plain TCP (MailHog/GreenMail on port 1025); STARTTLS = port 587; SSL = port 465
  security = "NONE"
  security = ${?SMTP_SECURITY}
  default-language = "de"
  default-language = ${?EMAIL_DEFAULT_LANG}
}