# Development configuration
# Includes test data and development-friendly settings

server {
  host = "0.0.0.0"
  port = 8080
}

database {
  driver = "org.postgresql.Driver"
  url = "jdbc:postgresql://localhost:5432/dispax"
  user = "dispax"
  password = "dispax"
  maxPoolSize = 10
  minIdle = 2
}

# Development specific settings
flyway {
  environment = "development"
  # In development, run all migrations including test data
  locations = ["classpath:db/migration", "classpath:db/migration-dev"]
  baselineOnMigrate = true
}

smtp {
  host = "localhost"
  host = ${?SMTP_HOST}
  port = 1025
  port = ${?SMTP_PORT}
  user = ""
  user = ${?SMTP_USER}
  password = ""
  password = ${?SMTP_PASSWORD}
  from = "noreply@dispax.de"
  from = ${?SMTP_FROM}
  replyTo = "support@dispax.de"
  replyTo = ${?SMTP_REPLY_TO}
  # NONE = plain TCP (MailHog/GreenMail on port 1025); STARTTLS = port 587; SSL = port 465
  security = "NONE"
  security = ${?SMTP_SECURITY}
  default-language = "de"
  default-language = ${?EMAIL_DEFAULT_LANG}
}