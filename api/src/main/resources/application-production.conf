# Production configuration
# Override default settings for production environment

server {
  host = "0.0.0.0"
  port = ${?PORT} # Set from environment variable (e.g. Railway, Heroku)
  port = 8080     # Default fallback
}

database {
  driver = "org.postgresql.Driver"
  url = ${?DATABASE_URL}     # Set from environment variable
  user = ${?DATABASE_USER}   # Set from environment variable  
  password = ${?DATABASE_PASSWORD} # Set from environment variable
  maxPoolSize = 20
  minIdle = 5
}

# Production specific settings
flyway {
  environment = "production"
  # In production, only run schema migrations, no test data
}