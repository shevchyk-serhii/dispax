# Test configuration
# Selected by APP_ENV=test. Targets the isolated `postgres-test` database
# (docker-compose service, 5433/dispax_test) so it never touches the dev DB on
# 5432. Like development, it includes seed data (db/migration-dev) so HTTP-level
# integration tests have demo accounts to log in with.

server {
  host = "0.0.0.0"
  port = 8090     # Distinct from the dev server (8080) so both can run at once
  port = ${?PORT} # Override with environment variable if provided
}

database {
  driver = "org.postgresql.Driver"
  url = "jdbc:postgresql://localhost:5433/dispax_test"
  url = ${?DATABASE_URL}
  user = "dispax"
  user = ${?DATABASE_USER}
  password = "dispax"
  password = ${?DATABASE_PASSWORD}
  maxPoolSize = 5
  minIdle = 1
}

# Test-specific settings
flyway {
  environment = "test"
  # In test, run schema + seed data so login-based integration flows work.
  locations = ["classpath:db/migration", "classpath:db/migration-dev"]
  baselineOnMigrate = true
}
