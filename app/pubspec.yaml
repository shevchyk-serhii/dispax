name: oktopus
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  http: ^1.2.2
  shared_preferences: ^2.3.4
  table_calendar: ^3.1.2
  intl: ^0.19.0
  mapbox_maps_flutter: ^2.3.0
  geolocator: ^13.0.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/driver_marker.svg
    - assets/client_marker.svg
    - assets/pickup_marker.svg
    - assets/destination_marker.svg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/oktopus_icon.svg"
  adaptive_icon_background: "#4A90E2"
  adaptive_icon_foreground: "assets/oktopus_icon.svg"
