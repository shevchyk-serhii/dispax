<!DOCTYPE html>
<html>
<head>
    <title>Oktopus Icon Generator</title>
</head>
<body>
    <canvas id="iconCanvas" width="1024" height="1024" style="border: 1px solid #ccc;"></canvas>
    
    <script>
        const canvas = document.getElementById('iconCanvas');
        const ctx = canvas.getContext('2d');
        
        // Background
        const gradient = ctx.createRadialGradient(512, 300, 100, 512, 512, 600);
        gradient.addColorStop(0, '#4A90E2');
        gradient.addColorStop(1, '#2E5BBA');
        
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(512, 512, 480, 0, 2 * Math.PI);
        ctx.fill();
        
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 16;
        ctx.stroke();
        
        // Octopus body gradient
        const bodyGradient = ctx.createRadialGradient(512, 360, 80, 512, 400, 180);
        bodyGradient.addColorStop(0, '#FF6B6B');
        bodyGradient.addColorStop(1, '#E74C3C');
        
        // Body
        ctx.fillStyle = bodyGradient;
        ctx.beginPath();
        ctx.ellipse(512, 400, 160, 140, 0, 0, 2 * Math.PI);
        ctx.fill();
        
        // Head
        ctx.beginPath();
        ctx.ellipse(512, 320, 120, 100, 0, 0, 2 * Math.PI);
        ctx.fill();
        
        // Eyes
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.arc(480, 300, 25, 0, 2 * Math.PI);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(544, 300, 25, 0, 2 * Math.PI);
        ctx.fill();
        
        ctx.fillStyle = '#2C3E50';
        ctx.beginPath();
        ctx.arc(485, 305, 15, 0, 2 * Math.PI);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(549, 305, 15, 0, 2 * Math.PI);
        ctx.fill();
        
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.arc(488, 302, 6, 0, 2 * Math.PI);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(552, 302, 6, 0, 2 * Math.PI);
        ctx.fill();
        
        // Tentacles
        ctx.strokeStyle = '#E74C3C';
        ctx.lineWidth = 28;
        ctx.lineCap = 'round';
        
        const tentacles = [
            {start: [420, 480], control: [320, 520], end: [280, 620]},
            {start: [380, 520], control: [250, 560], end: [200, 680]},
            {start: [420, 580], control: [340, 700], end: [320, 820]},
            {start: [604, 580], control: [684, 700], end: [704, 820]},
            {start: [644, 520], control: [774, 560], end: [824, 680]},
            {start: [604, 480], control: [704, 520], end: [744, 620]},
            {start: [460, 540], control: [350, 580], end: [320, 700]},
            {start: [564, 540], control: [674, 580], end: [704, 700]}
        ];
        
        tentacles.forEach(tentacle => {
            ctx.beginPath();
            ctx.moveTo(tentacle.start[0], tentacle.start[1]);
            ctx.quadraticCurveTo(tentacle.control[0], tentacle.control[1], tentacle.end[0], tentacle.end[1]);
            ctx.stroke();
        });
        
        // Car on body
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.fillRect(480, 380, 64, 24);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.fillRect(488, 372, 48, 16);
        
        ctx.fillStyle = '#2C3E50';
        ctx.beginPath();
        ctx.arc(492, 408, 6, 0, 2 * Math.PI);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(532, 408, 6, 0, 2 * Math.PI);
        ctx.fill();
        
        // Download function
        setTimeout(() => {
            const link = document.createElement('a');
            link.download = 'oktopus_icon.png';
            link.href = canvas.toDataURL();
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }, 1000);
    </script>
</body>
</html>
