  <circle cx="744" cy="700" r="7" fill="#C0392B" opacity="0.8"/>
  
  <circle cx="380" cy="770" r="6" fill="#C0392B" opacity="0.8"/>
  <circle cx="644" cy="770" r="6" fill="#C0392B" opacity="0.8"/>
  
  <!-- Taxi/Transport elements -->
  <!-- Small car silhouette on octopus body -->
  <rect x="480" y="380" width="64" height="24" rx="12" fill="#FFFFFF" opacity="0.9"/>
  <rect x="488" y="372" width="48" height="16" rx="8" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="492" cy="408" r="6" fill="#2C3E50"/>
  <circle cx="532" cy="408" r="6" fill="#2C3E50"/>
  
