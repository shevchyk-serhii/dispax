  <!-- Suction Cups on Tentacles -->
  <circle cx="350" cy="650" r="8" fill="#C0392B" opacity="0.8"/>
  <circle cx="380" cy="680" r="6" fill="#C0392B" opacity="0.8"/>
  <circle cx="280" cy="700" r="7" fill="#C0392B" opacity="0.8"/>
  
  <circle cx="674" cy="650" r="8" fill="#C0392B" opacity="0.8"/>
